name: Update ratings

on:
  schedule:
    # Saturday 08:00 and Sunday 13:00 America/New_York, expressed in UTC.
    # Saturday morning catches Friday night; Sunday afternoon catches the
    # corrections, forfeits and late-posted Saturday games.
    #
    # GitHub cron is UTC only, so these are pinned to EDT (UTC-4). That covers
    # the regular season, but DST ends on the first Sunday of November and the
    # playoffs run to the state finals in early December -- through those weeks
    # these fire an hour earlier, at 07:00 and 12:00 ET. Still comfortably
    # after the games, so it is left alone rather than split into two schedules.
    - cron: "0 12 * * 6"
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Bypass the local HTTP cache"
        type: boolean
        default: false
      retune:
        description: "Re-fit the model constants against past seasons (~2 min)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # What CI actually resolved. Committed results depend on numpy and scipy
      # -- solver, sparse products, RNG -- so when a numerical diff appears with
      # no code change, this is the first place to look.
      - name: Record the resolved dependency versions
        run: |
          python -c "import sys; print('python', sys.version)"
          pip freeze | tee data/requirements.lock

      # Unit tests run before anything touches the network. A broken resolver
      # or model should fail here, in seconds, not after 44 requests.
      - name: Unit tests
        run: python -m pytest tests/ -q

      # One-time backfill. Past seasons are finished, so once their scores are
      # committed there is nothing to re-read -- skipping keeps the weekly run
      # at 44 requests instead of 176.
      - name: Backfill past seasons (first run only)
        run: |
          for Y in 2023 2024 2025; do
            if [ ! -f "data/games_$Y.csv" ]; then
              echo "Backfilling $Y."
              python scripts/scrape.py --season "$Y"
            else
              echo "$Y already on disk, skipping."
            fi
          done

      # Fits squash_scale, prior_games and carry by walk-forward prediction on
      # the historical seasons. Slow, and the answer barely moves between runs,
      # so it is opt-in rather than weekly.
      # This step runs BEFORE the scrape, so it fits on the COMMITTED historical
      # CSVs. If the parser has changed since those were written, the fit is
      # against data the current scraper would no longer produce -- which is
      # exactly what happened when the nested-parenthesis and empty-city fixes
      # landed and recovered ~20% more games per season.
      #
      # This was previously an mtime test (`scripts/scrape.py -nt
      # data/games_$Y.csv`). That guard could never fire: git does not preserve
      # mtimes, so on a fresh checkout every file carries the same timestamp and
      # `-nt` is always false. The marker below is written by the scraper itself.
      - name: Re-fit model constants
        if: ${{ inputs.retune }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from scrape import PARSER_VERSION
          try:
              recorded = json.load(open("data/parser_versions.json"))
          except Exception:
              recorded = {}
          stale = [y for y in ("2023", "2024", "2025")
                   if recorded.get(y) != PARSER_VERSION]
          if stale:
              print(f"::error::seasons {stale} were scraped by parser version "
                    f"{[recorded.get(y) for y in stale]}, but scrape.py is at "
                    f"{PARSER_VERSION}. Re-fitting now would fit on history the "
                    f"current parser would not produce. Re-scrape first:")
              for y in stale:
                  print(f"    python scripts/scrape.py --season {y}")
              raise SystemExit(1)
          print(f"all history recorded under parser version {PARSER_VERSION}")
          PY
          python scripts/tune.py --seasons 2023,2024,2025 --holdouts 1,2,4,7,10

      - name: Build last season's ratings and derive the preseason prior
        run: |
          if [ -f data/games_2025.csv ]; then
            # --no-schedule because the season is over. The scraper writes a
            # schedule_{yr}.csv for past seasons too -- a handful of games the
            # site marked '***' and never scored -- and without this flag
            # build.py would auto-detect it and hand last season's teams a
            # "remaining" fixture. That flows into prior.json and out into
            # this season's ratings.
            # --no-history as well: this is a build of a FINISHED season, so
            # it has nothing to forecast and nothing belongs in the prediction
            # log. build.py refuses to record an empty snapshot anyway; this
            # says so at the call site rather than relying on that.
            python scripts/build.py --no-site --no-prior --no-schedule --no-history \
              --games data/games_2025.csv \
              --roster data/roster_2025.csv \
              --out data/ratings_2025.json
            python scripts/season_prior.py \
              --from-ratings data/ratings_2025.json \
              --out data/prior.json
          else
            echo "No 2025 data; this season will run without a prior."
          fi

      - name: Scrape scores and roster
        run: |
          python scripts/scrape.py --season 2026 \
            ${{ inputs.no_cache && '--no-cache' || '' }}

      - name: Fit ratings and build the site
        run: python scripts/build.py

      # Record another forecaster's picks for the coming week, so the two can
      # be scored on the same games once they are played. Runs AFTER the build
      # because it matches his picks against our own fixture list, and BEFORE
      # the games for the same reason our own capture does: a prediction
      # recorded afterwards is not a prediction.
      #
      # `|| true` is deliberate. This is the only step that depends on a site
      # we do not control, and a board that refuses to publish because someone
      # else's server is down would be a bad trade. The script already fails
      # soft; this is belt and braces.
      - name: Record the comparison model's picks
        run: python scripts/capture_rivals.py || true

      - name: Sanity check the output
        run: python scripts/check.py

      # Publish BEFORE committing. The site is already built and checked at
      # this point, and nothing about pushing the data back to the repo can
      # improve it -- so the deploy must not be downstream of a step that can
      # fail for reasons that have nothing to do with the ratings. It used to
      # be: a `git push` that lost a race meant the job failed here and the
      # week's board never reached the live site.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Commit refreshed data
        run: |
          git config user.name  "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/history.jsonl is append-only and CANNOT be regenerated -- it is
          # the record of what the board predicted before each week was played.
          # Losing it loses the track record, so it must be committed like any
          # other result. `git add data/` covers it; this note exists so nobody
          # narrows that path later without realising what it drops.
          git add data/ site/ratings.json site/index.html site/app.html
          if git diff --staged --quiet; then
            echo "No change this run."
            exit 0
          fi
          git commit -m "ratings: refresh $(date -u +%Y-%m-%d)"
          # Alex pushes from GitHub Desktop, so the remote can move while a run
          # is in flight. Rebase onto whatever landed and try again rather than
          # failing on the race. The bot only ever touches generated files, so
          # a rebase here has nothing to conflict with.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt lost a race; rebasing onto the remote"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::could not push refreshed data after 3 attempts."
          echo "The site itself deployed fine above; only the data commit failed."
          exit 1
